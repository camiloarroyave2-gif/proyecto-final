databases:
  - name: taskflow-db
    plan: free
    region: ohio
    postgresMajorVersion: 16

services:
  - type: web
    name: taskflow
    runtime: python
    region: ohio
    plan: free
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
